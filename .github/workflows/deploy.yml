name: Build & Deploy News Aggregator

on:
  schedule:
    - cron: '5 * * * *'  # Every hour at minute 5
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/data/feeds.js'
      - 'package.json'
      - 'astro.config.mjs'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Scrape feeds
        run: npm run scrape
        env:
          # Add any API keys here if needed
          NODE_ENV: production
      
      - name: Generate pages
        run: node scripts/generate-pages.js
      
      - name: Build with Astro
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4